<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a
        routerLink="/cursos"
        class="text-lg font-semibold tracking-tight text-white hover:text-indigo-400"
      >
        Gerenciador de Cursos
      </a>

      <div class="flex items-center gap-3">
        <a
          routerLink="/cursos"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-300 hover:bg-slate-800/60 hover:text-white"
        >
          Cursos
        </a>
        <a
          routerLink="/cursos/novo"
          routerLinkActive="bg-indigo-600 text-white"
          class="rounded-lg bg-indigo-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-400"
        >
          Novo curso
        </a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <router-outlet />
  </main>
</div>
