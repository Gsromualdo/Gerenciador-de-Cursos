services:
  postgres:
    image: postgres:16-alpine
    container_name: gerenciador_cursos_db
    environment:
      POSTGRES_DB: gerenciador_cursos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: